tools:
  - type: function
    function:
      name: go_to_page
      description: Navigates to a specified URL
      parameters:
        type: object
        properties:
          url:
            type: string
            description: The URL to navigate to.
        required:
          - url
  - type: function
    function:
      name: interact_with_form
      description: Interacts with a form on the current page, filling in specified fields based on user input or submitting data
      parameters:
        type: object
        properties:
          user_prompt:
            type: string
            description: The user's input describing what to fill in the form or submit
        required:
          - user_prompt
